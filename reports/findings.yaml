# MP243 findings — fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.
#
# Data checks run by: src/powerloom/data_checks.py
# Author: Divyanshi Maurya (Data Lead) — S24CSEU0803

group_id: "G018"          # your group id, e.g. "G042"
problem_id: "MP243"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.

  leaking_column:
    present: true
    column: "metres_checked_at_folding"   # measured at folding table AFTER shift ends;
                                           # missing from holdout_features.csv

  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of shed whose rows are affected
    factor: null           # wrong value = right value x factor

  sentinel_value:
    present: true
    column: "thread_count"
    value: 99              # repeated exactly 4 times across the dataset
    count: 4               # how many rows have it

  duplicate_rows:
    present: true
    count: 35              # number of EXTRA copies (rows you would delete)

  stuck_sensor:
    present: true
    column: "thread_count"
    start_date: "2026-03-14"   # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-03-28"     # last date with the stuck value, YYYY-MM-DD

  target_typos:
    present: true
    count: 7               # rows whose target was typed 10 times too big
                           # (metres_per_shift > 5×p95 ≈ 325m; values 416–578)

  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    loom_age_yr: null
    thread_count: null
    power_cuts_min: null
    weaver_exp_yr: null
    humidity_pct: null
    shift_hours: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of shed
    'Shed 1': null
    'Shed 2': null
    'Shed 3': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
